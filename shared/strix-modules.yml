modules:
  - type: kargs
    kargs:
      - "amdgpu.gttsize=126976"
      - "ttm.pages_limit=32505856"
      - "ttm.page_pool_size=32505856"
      - "amdttm.pages_limit=32505856"
      - "amdttm.page_pool_size=32505856"
      - "iommu=pt"

  - type: dnf
    install:
      packages:
        - bluez
        - mesa-vulkan-drivers
        - clinfo
        - rocminfo
        - jq

  - type: systemd
    system:
      enabled:
        - podman-restart.service
        - bluetooth.service

  - type: files
    files:
      - source: strix-first-boot.sh
        destination: /usr/bin/strix-first-boot.sh
      - source: strix-first-boot.service
        destination: /usr/lib/systemd/system/strix-first-boot.service
      - source: strix-halo-server-cosign.pub
        destination: /usr/share/pki/containers/strix-halo-server.pub
      - source: strix-halo-server-registries.yaml
        destination: /etc/containers/registries.d/strix-halo-server.yaml

  - type: script
    snippets:
      - |
        echo 'SUBSYSTEM=="accel", KERNEL=="accel*", GROUP="video", MODE="0660"' > /usr/lib/udev/rules.d/99-amdxdna-group.rules
      - |
        chmod 0755 /usr/bin/strix-first-boot.sh
      - |
        set -euo pipefail
        policy=/etc/containers/policy.json
        test -s "$policy"
        temporary_policy=$(mktemp /etc/containers/policy.json.XXXXXX)
        trap 'rm -f "$temporary_policy"' EXIT
        jq '.transports.docker["ghcr.io/bryanconradhart"] = [{
          "type": "sigstoreSigned",
          "keyPath": "/usr/share/pki/containers/strix-halo-server.pub",
          "signedIdentity": {"type": "matchRepository"}
        }]' "$policy" > "$temporary_policy"
        chmod 0644 "$temporary_policy"
        mv "$temporary_policy" "$policy"
        trap - EXIT

  - type: systemd
    system:
      enabled:
        - tuned.service
        - strix-first-boot.service
