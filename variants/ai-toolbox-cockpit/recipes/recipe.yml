name: strix-halo-server-ai-toolbox-cockpit
description: Strix Halo bootc image with AI Toolbox Cockpit
base-image: ghcr.io/ublue-os/ucore
image-version: stable

modules:
  - from-file: ../../../shared/strix-modules.yml

  - type: dnf
    install:
      packages:
        - pipx

  - type: script
    snippets:
      - PIPX_GLOBAL_BIN_DIR=/usr/bin pipx install --global "git+https://github.com/kyuz0/ai-toolbox-cockpit.git"
