name: strix-halo-server-arcane-manager
description: Strix Halo bootc image with Arcane Manager
base-image: ghcr.io/ublue-os/ucore
image-version: stable

modules:
  - from-file: ../../../shared/strix-modules.yml

  - type: rpm-ostree
    install:
      - openssl

  - type: files
    files:
      - source: arcane-manager-enroll.service
        destination: /usr/lib/systemd/system/arcane-manager-enroll.service
      - source: arcane-manager-enroll.sh
        destination: /usr/libexec/arcane-manager-enroll.sh
      - source: arcane-manager.container
        destination: /usr/share/containers/systemd/arcane-manager.container

  - type: script
    snippets:
      - chmod 0755 /usr/libexec/arcane-manager-enroll.sh

  - type: systemd
    system:
      enabled:
        - podman.socket
        - podman-auto-update.timer
        - arcane-manager-enroll.service
