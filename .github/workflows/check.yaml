name: Verify and Test Pull Request Changes

on:
  pull_request:
    branches:
      - main

jobs:
  verify-recipe:
    name: Verify ${{ matrix.variant }} image recipe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - arcane-manager
          - arcane-agent-edge
          - arcane-manager-direct
          - ai-toolbox-cockpit
          - lemonade
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare shared files
        run: ./scripts/prepare-variant-files.sh "${{ matrix.variant }}"

      - name: Test build image
        uses: blue-build/github-action@v1
        with:
          recipe: 'recipe.yml'
          working_directory: ./variants/${{ matrix.variant }}
          registry: ghcr.io
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          prune: true
          push: false
          skip_checkout: true

  verify-lemonade-docker:
    name: Verify Lemonade server Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lemonade Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./variants/lemonade/docker
          file: ./variants/lemonade/docker/Dockerfile
          push: false
          load: true
          tags: lemonade-server-halo:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container binaries
        run: |
          docker run --rm --entrypoint /bin/sh lemonade-server-halo:pr-test -c "
            podman --version &&
            lemonade --version &&
            id -u | grep -q '^10001$'
          "
