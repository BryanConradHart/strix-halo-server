name: Verify and Test Pull Request Changes

on:
  pull_request:
    branches:
      - main

jobs:
  verify-recipe:
    name: Test compile BlueBuild recipe against PR branch
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Test build image
        uses: blue-build/github-action@v1
        with:
          recipe: 'recipe.yaml'
          registry: ghcr.io
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          prune: true
          push: false

      - name: Test build installer ISO
        run: |
          docker run --rm \
            --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/blue-build/cli \
            bluebuild generate-iso \
              --iso-name strix-halo.iso \
              recipe /workspace/recipes/recipe.yaml
