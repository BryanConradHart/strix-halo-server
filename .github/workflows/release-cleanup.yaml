name: Release cleanup

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Keep newest 4 releases and newest release from each of the last 4 weeks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import datetime

          def gh_json(args):
              proc = subprocess.run(
                  ["gh", *args],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return json.loads(proc.stdout or "[]")

          releases = gh_json([
              "release", "list",
              "--limit", "200",
              "--json", "tagName,createdAt,isDraft,isPrerelease"
          ])

          releases = [
              r for r in releases
              if not r.get("isDraft", False) and not r.get("isPrerelease", False)
          ]

          if not releases:
              print("No releases to prune.")
              sys.exit(0)

          releases.sort(key=lambda r: r["createdAt"], reverse=True)

          keep = set()

          # Keep newest 4 releases
          for r in releases[:4]:
              keep.add(r["tagName"])

          # Keep newest release from each of the last 4 calendar weeks
          now = datetime.datetime.now(datetime.timezone.utc)
          for weeks_back in range(4):
              end = now - datetime.timedelta(weeks=weeks_back)
              start = end - datetime.timedelta(days=7)

              candidates = [
                  r for r in releases
                  if start <= datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) < end
              ]
              if candidates:
                  keep.add(candidates[0]["tagName"])

          for r in releases:
              tag = r["tagName"]
              if tag not in keep:
                  print(f"Deleting release {tag}")
                  subprocess.run(
                      ["gh", "release", "delete", tag, "--yes", "--cleanup-tag"],
                      check=False,
                  )
          PY
