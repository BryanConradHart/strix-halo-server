name: Build and Push Strix Halo Image

on:
  schedule:
    - cron: '0 0 * * 1' # Rebuilds automatically every Monday at midnight to pull upstream security fixes
  push:
    branches:
      - main
  workflow_dispatch: # adds a manual build option

jobs:
  build-and-release:
    uses: ./.github/workflows/release-build-reusable.yaml
    with:
      dry_run: false
    secrets: inherit
