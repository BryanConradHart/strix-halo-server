name: Build and Publish Strix Halo Image

on:
  schedule:
    - cron: '0 0 * * 1' # Rebuilds automatically every Monday at midnight to pull upstream security fixes
  push:
    branches:
      - main # Triggers a fresh build whenever you push or merge to main
  workflow_dispatch: # Adds a Run Workflow button in GitHub UI

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tag:
    name: Compute shared image tag
    runs-on: ubuntu-latest
    steps:
      - name: Compute build tag
        id: meta
        shell: bash
        run: |
          echo "tag=v$(date -u +%Y.%m.%d-%H%M%S)-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  build-and-publish:
    name: Build and Publish ${{ matrix.variant }} image
    needs: build-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            image: strix-halo-server
          - variant: arcane-manager
            image: strix-halo-server-arcane-manager
          - variant: arcane-agent-edge
            image: strix-halo-server-arcane-agent-edge
          - variant: arcane-manager-direct
            image: strix-halo-server-arcane-manager-direct
          - variant: ai-toolbox-cockpit
            image: strix-halo-server-ai-toolbox-cockpit
          - variant: lemonade
            image: strix-halo-server-lemonade
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare shared files
        run: ./scripts/prepare-variant-files.sh "${{ matrix.variant }}"

      - name: Build and Publish Container Image
        uses: blue-build/github-action@v1
        with:
          recipe: 'recipe.yml'
          working_directory: ./variants/${{ matrix.variant }}
          registry: ghcr.io
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          prune: true
          push: true
          skip_checkout: true

      - name: Publish a versioned image tag
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ needs.build-tag.outputs.tag }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          docker pull "${IMAGE}:latest"
          docker tag "${IMAGE}:latest" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"
          cosign verify --key cosign.pub "${IMAGE}:latest" >/dev/null
          cosign verify --key cosign.pub "${IMAGE}:${IMAGE_TAG}" >/dev/null

  build-and-publish-lemonade-docker:
    name: Build and Publish Lemonade server Docker image
    needs: build-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-tag.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lemonade-server-halo"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:edge,${IMAGE}:latest,${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Lemonade Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./variants/lemonade/docker
          file: ./variants/lemonade/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign and verify published image tags
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ needs.build-tag.outputs.tag }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          for tag in edge latest "${IMAGE_TAG}"; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}:${tag}"
            cosign verify --key cosign.pub "${IMAGE}:${tag}" >/dev/null
          done
