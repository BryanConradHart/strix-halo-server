name: ucore-strix-halo
description: Public uCore bootc base image optimized for AMD Strix Halo GenAI platforms
base-image: quay.io/ublue-os/ucore
image-version: stable

modules:
  # 1. Hardware Memory Table Configuration
  # SUCCESS: "kargs" is the official validated module for kernel arguments
  - type: kargs
    args:
      - "amdgpu.gttsize=126976"
      - "ttm.pages_limit=32505856"
      - "ttm.page_pool_size=32505856"
      - "amdttm.pages_limit=32505856"
      - "amdttm.page_pool_size=32505856"
      - "iommu=pt"

  # 2. Compute Drivers & Profiling Software
  - type: rpm-ostree
    install:
      - mesa-vulkan-drivers
      - clinfo
      - rocminfo
      - tuned

  # 3. Explicit File Routing Matrix
  - type: files
    files:
      - src: services/ucore-first-boot.service
        dest: /etc/systemd/system/ucore-first-boot.service
      - src: scripts/ucore-first-boot.sh
        dest: /usr/local/bin/ucore-first-boot.sh

  # 4. Image Compilation Step Trigger
  - type: script
    scripts:
      - setup-base-services.sh
